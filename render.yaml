services:
  - type: web
    name: reaching-unreal-app
    runtime: static
    buildCommand: cd app && npm ci && npm run build
    staticPublishPath: ./app/dist
    envVars:
      - key: VITE_YWS_URL
        value: wss://reaching-unreal-sync.onrender.com
      # Use the same room as the current app so existing logs load.
      - key: VITE_ROOM
        sync: false

  - type: web
    name: reaching-unreal-sync
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/ru-data
      # Push notifications. Set these in the Render dashboard
      # (Settings → Environment) — never commit them to git.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Durable cross-restart storage (Upstash Redis REST). Set these in the
      # Render dashboard from your Upstash database's REST API page. Without
      # them the server falls back to ephemeral /tmp and only relays live.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
